<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Sellyn</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Oculto por defecto: solo se muestra en el marco de celular de escritorio. */
      .phone-caption {
        display: none;
      }

      /* Marco de celular: solo en pantallas anchas (desktop). En un celular real
         de menos de 501px de ancho no se aplica nada de esto y la app ocupa
         toda la pantalla como una web app normal. */
      @media (min-width: 501px) {
        html, body {
          height: 100%;
          background: radial-gradient(circle at 50% 0%, #232a6b 0%, #0B1043 55%, #060814 100%);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .phone-caption {
          display: block;
          position: fixed;
          top: 28px;
          left: 50%;
          transform: translateX(-50%);
          text-align: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          color: #E6E9FF;
          pointer-events: none;
        }
        .phone-caption .brand {
          font-size: 14px;
          letter-spacing: 3px;
          color: #8E97F0;
          font-weight: 700;
          margin: 0 0 6px;
        }
        .phone-caption p {
          font-size: 13px;
          margin: 0;
          color: #A7B0E8;
        }
        #root {
          width: 390px !important;
          height: 844px !important;
          max-height: 88vh !important;
          flex: none !important;
          border-radius: 46px;
          overflow: hidden;
          box-shadow:
            0 0 0 12px #05060f,
            0 0 0 14px #2a2f55,
            0 30px 70px rgba(0,0,0,0.55),
            0 0 60px rgba(124,108,245,0.25);
        }
      }
    </style>
  <link rel="icon" href="/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div class="phone-caption">
      <p class="brand">SELLYN</p>
      <p>Demo interactivo — vista previa en formato celular</p>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/_expo/static/js/web/entry-1016f18f20ab537f424242d3c4420328.js" defer></script>
</body>
</html>
