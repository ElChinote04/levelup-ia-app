<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LevelUp IA! — Prototipo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #05070f;
    font-family: Manrope, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }
  #shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 40px 16px 56px;
  }
  #shell-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }
  #shell-header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #7C86E8;
  }
  #shell-header .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.01em;
  }
  #shell-header .hint {
    font-size: 13px;
    color: #8189B8;
    max-width: 46ch;
  }
  #phone-wrap {
    position: relative;
  }
  #phone {
    width: 390px;
    max-width: calc(100vw - 32px);
    transition: opacity .16s ease, transform .16s ease;
  }
  #phone.fade-out { opacity: 0; transform: scale(.985); }
  #back-fab {
    position: absolute;
    top: -14px;
    left: -14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #171E7A;
    border: 1px solid #3A45BA;
    color: #E6E9FF;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.6);
    z-index: 5;
  }
  #back-fab.show { display: flex; }
  a { color: inherit; }
  [data-nav], [data-back], [data-select] { cursor: pointer; }
  [data-nav]:active, [data-back]:active, [data-select]:active { filter: brightness(1.08); }
  #qa-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 640px;
    padding: 16px 18px;
    border-radius: 18px;
    background: #0E1456;
    border: 1px solid #23297A;
  }
  #qa-strip .qa-label {
    width: 100%;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #6670C4;
    margin-bottom: 4px;
  }
  .qa-dot {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: #171E7A;
    border: 1px solid #2B35A2;
    color: #AEB6EE;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .qa-dot.active {
    background: linear-gradient(135deg,#6C63F0,#3A32C9);
    color: #fff;
    border-color: transparent;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: #171E7A;
    border: 1px solid #4338CA;
    color: #fff;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,.6);
    z-index: 20;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="shell">
  <div id="shell-header">
    <div class="eyebrow">LevelUp IA! · prototipo funcional</div>
    <div class="title" id="screen-title">00 · Animación de apertura</div>
    <div class="hint">Toca los botones dentro de la pantalla para navegar, igual que en la app real. La franja de abajo es solo para saltar directo a cualquier pantalla durante la revisión.</div>
  </div>

  <div id="phone-wrap">
    <div id="back-fab" onclick="goBack()">←</div>
    <div id="phone"></div>
  </div>

  <div id="qa-strip"></div>
</div>

<div id="toast"></div>

<script>
// ---------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------
const state = {
  screen: 0,
  history: [],
  business: new Set(['ecommerce', 'ropa']),
  quiz: 'b',
  caseDecision: null,
  planetIndex: 0,
};

const PLANETS = [
  { name: 'Mentalidad', done: 3, total: 8, from: '#9E8CFF', to: '#4338CA' },
  { name: 'Marketing', done: 1, total: 8, from: '#8CC7FF', to: '#3854C4' },
  { name: 'Ventas', done: 0, total: 8, from: '#FF9E8C', to: '#C43854' },
  { name: 'E-Commerce', done: 5, total: 8, from: '#8CFFE0', to: '#38C4A0' },
  { name: 'IA', done: 0, total: 8, from: '#C9A7FF', to: '#6C3DC4' },
  { name: 'Escalamiento', done: 0, total: 8, from: '#FFD98C', to: '#C48838' },
  { name: 'Branding Express', done: 0, total: 8, from: '#FF8CC9', to: '#C43897' },
  { name: 'Finanzas', done: 0, total: 8, from: '#8CA7FF', to: '#3846C4' },
];

const SCREEN_META = [
  '00 · Animación de apertura',
  '01 · Welcome / Login',
  '02 · Crea tu cuenta',
  '03 · Tipo de negocio',
  '04 · Dashboard principal',
  '05 · Logros e insignias',
  '06 · Galaxia (intro mundo)',
  '07 · Camino del planeta',
  '08 · Lección · Video',
  '09 · Lección · Preguntas',
  '10 · Lección · Caso práctico',
  '11 · Lección · Resolución',
  '12 · Chat con Nova',
  '13 · Sin diamantes → Premium',
  '14 · Beneficios Premium',
];

// ---------------------------------------------------------------------
// Navegación
// ---------------------------------------------------------------------
function go(id) {
  if (id === state.screen) return;
  state.history.push(state.screen);
  state.screen = id;
  render();
}

function goBack() {
  if (!state.history.length) return;
  state.screen = state.history.pop();
  render();
}

function qaJump(id) {
  state.history = [];
  state.screen = id;
  render();
}

function toggleBusiness(key) {
  if (state.business.has(key)) state.business.delete(key);
  else state.business.add(key);
  render();
}

function setQuiz(letter) {
  state.quiz = letter;
  render();
}

function setCase(v) {
  state.caseDecision = v;
  render();
}

function cyclePlanet(delta) {
  state.planetIndex = (state.planetIndex + delta + PLANETS.length) % PLANETS.length;
  render();
}

function jumpPlanet(i) {
  state.planetIndex = i;
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function activatePremium() {
  showToast('¡Premium activado! Bienvenida de vuelta 🚀');
  state.history = [];
  state.screen = 4;
  render();
}

function finishLesson() {
  // Completar la lección es una salida, no un paso más del wizard:
  // el camino queda como si se hubiera llegado directo desde la galaxia,
  // para que "atrás" no reingrese a los pasos de la lección ya cerrada.
  state.history = [6];
  state.screen = 7;
  render();
}

// ---------------------------------------------------------------------
// Fragmentos compartidos
// ---------------------------------------------------------------------

    <div>9:41</div>
    <div>▮▮▮</div>
  </div>`;
}

function diamondPill(value, extra) {
  return `<div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:#27319E;border:1px solid #3A45BA;${extra || ''}">

// ---------------------------------------------------------------------
// Render + delegación de eventos
// ---------------------------------------------------------------------
function render() {
  const phone = document.getElementById('phone');
  phone.classList.add('fade-out');
  setTimeout(() => {
    phone.innerHTML = screens[state.screen]();
    phone.classList.remove('fade-out');
  }, 130);

  document.getElementById('screen-title').textContent = SCREEN_META[state.screen];
  document.getElementById('back-fab').classList.toggle('show', state.history.length > 0);

  const strip = document.getElementById('qa-strip');
  strip.innerHTML = '<div class="qa-label">Saltar a cualquier pantalla</div>' +
    SCREEN_META.map((_, i) => `<div class="qa-dot${i === state.screen ? ' active' : ''}" onclick="qaJump(${i})">${String(i).padStart(2, '0')}</div>`).join('');
}

document.getElementById('phone-wrap').addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  const back = e.target.closest('[data-back]');
  const select = e.target.closest('[data-select]');
  if (select) {
    const group = select.dataset.select;
    const key = select.dataset.key;
    if (group === 'business') toggleBusiness(key);
    else if (group === 'quiz') setQuiz(key);
    else if (group === 'case') setCase(key);
    return;
  }
  if (nav) { go(parseInt(nav.dataset.nav, 10)); return; }
  if (back) { goBack(); return; }
});

render();
